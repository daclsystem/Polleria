# Nginx — front en dominio propio
# DNS A: chifapollerialopez.com + www → IP del VPS
# API: apipchifapollerialopez.indevsoft.com (o el host real del API)

server {
    listen 80;
    listen [::]:80;
    server_name chifapollerialopez.com www.chifapollerialopez.com;

    root /opt/polleria/web;
    index index.html;
    client_max_body_size 20m;

    # version.json NUNCA cachear (auto-update de apps)
    location ~* /version\.json$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    # index.html sin cache largo
    location ~* /(index\.html)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /cliente/ {
        alias /opt/polleria/web/cliente/;
        try_files $uri $uri/ /cliente/index.html;
    }

    location /system/ {
        alias /opt/polleria/web/system/;
        try_files $uri $uri/ /system/index.html;
    }

    location /driver/ {
        alias /opt/polleria/web/driver/;
        try_files $uri $uri/ /driver/index.html;
    }

    # Assets con hash: cache largo
    location ~* /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
